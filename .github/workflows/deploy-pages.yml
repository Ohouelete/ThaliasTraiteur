# Publie UNIQUEMENT le dossier "ThaliasTraiteur/" sur GitHub Pages.
# Le reste du repo (mail-template/, sarab_ressources/, Documentation/…)
# n'est jamais copié sur le site en ligne.
name: Déploiement du site (sarab) sur GitHub Pages

on:
  push:
    branches: [main]     # publie quand on met à jour "main"
  workflow_dispatch:      # …ou manuellement depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site folder only
        uses: actions/upload-pages-artifact@v3
        with:
          path: ThaliasTraiteur            # <-- SEUL ce dossier est publié
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
